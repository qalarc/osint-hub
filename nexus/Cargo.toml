[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-server",
    "crates/nexus-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
